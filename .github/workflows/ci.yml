# Continuous integration: runs on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Tests, then the pipeline and baselines; the outputs must match the committed files
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install
        run: pip install -r requirements-pipeline.txt
      - name: Unit and data tests
        run: pytest -v
      - name: Run the pipeline (saved snapshot)
        run: python -m pipeline.run
      - name: Run the baseline models
        run: python src/analysis.py
      - name: Check that the outputs match the committed files
        run: python scripts/check_reproducible.py

  # Calls the real World Bank API. An outage on their side should not block a merge.
  live-api:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: World Bank API test
        run: pytest -v tests/test_live_api.py
        env:
          RUN_LIVE_API: "1"
      - name: Pipeline with live World Bank data
        run: python -m pipeline.run --live

  # The graph neural network runs end to end with tiny settings (about 1 minute)
  gnn-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch first)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python -m pipeline.run
      - run: python src/gnn.py --quick

  # The Docker image builds and runs the pipeline and baselines
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ecowas-gnn .
      - name: Run pipeline and baselines in the container
        run: docker run --rm ecowas-gnn bash -c "python -m pipeline.run && python src/analysis.py"
