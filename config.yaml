# =============================================================================
# config.yaml
# The single place for every setting in the project: years, countries, the
# border network, data sources, file paths, and model settings.
# The pipeline (pipeline/) and the model scripts (src/) all read this file.
# =============================================================================

# -----------------------------------------------------------------------------
# Years
# The study period is start to end: the models train and are tested on these
# years. The pipeline also loads the year before start, so that the first year
# has prior-year (lagged) values.
# After the study period, the pipeline builds model inputs for every year up to
# forecast. Each forecast year is scored from conditions in the year before.
#   check:    out-of-sample check, scored and compared with what happened
#   forecast: the current watch list
# To move the watch list forward a year, raise forecast (after the V-Dem file
# has data for the year before it).
# -----------------------------------------------------------------------------
years:
  start: 2001
  end: 2024
  check: 2025
  forecast: 2026

# -----------------------------------------------------------------------------
# The 15 ECOWAS members
# vdem_name is how V-Dem spells the country.
# fips is the country code GDELT uses (FIPS 10-4); it differs from ISO, for
#   example Niger is NG and Nigeria is NI.
# landlocked: 1 for Mali, Burkina Faso, and Niger.
# waemu: 1 for members of the West African Economic and Monetary Union (the
#   CFA franc zone). These eight share a currency and a central bank.
# -----------------------------------------------------------------------------
countries:
  - {iso3: BEN, name: Benin,          vdem_name: Benin,         landlocked: 0, fips: BN, waemu: 1}
  - {iso3: BFA, name: Burkina Faso,   vdem_name: Burkina Faso,  landlocked: 1, fips: UV, waemu: 1}
  - {iso3: CPV, name: Cabo Verde,     vdem_name: Cape Verde,    landlocked: 0, fips: CV, waemu: 0}
  - {iso3: CIV, name: Cote d'Ivoire,  vdem_name: Ivory Coast,   landlocked: 0, fips: IV, waemu: 1}
  - {iso3: GMB, name: Gambia,         vdem_name: The Gambia,    landlocked: 0, fips: GA, waemu: 0}
  - {iso3: GHA, name: Ghana,          vdem_name: Ghana,         landlocked: 0, fips: GH, waemu: 0}
  - {iso3: GIN, name: Guinea,         vdem_name: Guinea,        landlocked: 0, fips: GV, waemu: 0}
  - {iso3: GNB, name: Guinea-Bissau,  vdem_name: Guinea-Bissau, landlocked: 0, fips: PU, waemu: 1}
  - {iso3: LBR, name: Liberia,        vdem_name: Liberia,       landlocked: 0, fips: LI, waemu: 0}
  - {iso3: MLI, name: Mali,           vdem_name: Mali,          landlocked: 1, fips: ML, waemu: 1}
  - {iso3: NER, name: Niger,          vdem_name: Niger,         landlocked: 1, fips: NG, waemu: 1}
  - {iso3: NGA, name: Nigeria,        vdem_name: Nigeria,       landlocked: 0, fips: NI, waemu: 0}
  - {iso3: SEN, name: Senegal,        vdem_name: Senegal,       landlocked: 0, fips: SG, waemu: 1}
  - {iso3: SLE, name: Sierra Leone,   vdem_name: Sierra Leone,  landlocked: 0, fips: SL, waemu: 0}
  - {iso3: TGO, name: Togo,           vdem_name: Togo,          landlocked: 0, fips: TO, waemu: 1}

# Members that left ECOWAS on January 29, 2025
exited_2025: [MLI, BFA, NER]

# -----------------------------------------------------------------------------
# Border network: each member and the members it shares a land border with.
# Cabo Verde is an island and has no connections.
# -----------------------------------------------------------------------------
borders:
  BEN: [NGA, NER, BFA, TGO]
  BFA: [MLI, NER, BEN, TGO, GHA, CIV]
  CPV: []
  CIV: [LBR, GIN, MLI, BFA, GHA]
  GMB: [SEN]
  GHA: [CIV, BFA, TGO]
  GIN: [GNB, SEN, MLI, CIV, LBR, SLE]
  GNB: [SEN, GIN]
  LBR: [SLE, GIN, CIV]
  MLI: [SEN, GIN, CIV, BFA, NER]
  NER: [MLI, BFA, BEN, NGA]
  NGA: [BEN, NER]
  SEN: [GMB, GNB, GIN, MLI]
  SLE: [GIN, LBR]
  TGO: [GHA, BFA, BEN]

# -----------------------------------------------------------------------------
# Data sources
# -----------------------------------------------------------------------------
sources:
  world_bank:
    # Live mode calls this API. Local mode reads the saved snapshot instead.
    api_url: https://api.worldbank.org/v2
    first_year: 2000
    last_year: 2025
    snapshot: data/raw/world_bank.csv
    indicators:
      NY.GDP.MKTP.KD.ZG: gdp_growth        # real GDP growth, annual %
      FP.CPI.TOTL.ZG: inflation            # consumer price inflation, annual %
      NE.IMP.GNFS.ZS: imports_pct_gdp      # imports as a share of GDP
      NE.IMP.GNFS.KD: imports_real         # imports in constant US dollars
  vdem:
    # V-Dem has no live API; it publishes one dataset release each year.
    version: v16
    file: data/raw/vdem_ecowas_subset.csv
  ecowas_events:
    # Hand-coded from ECOWAS communiques and news coverage
    file: data/raw/ecowas_events.csv
  gdelt:
    # GDELT 1.0 event files, counted by country (ActionGeo_CountryCode) and month.
    # scripts/refresh_gdelt.py rebuilds the snapshot (run in GitHub Actions,
    # .github/workflows/refresh-data.yml).
    index_url: http://data.gdeltproject.org/events/index.html
    first_year: 2000
    last_year: 2025
    snapshot: data/raw/gdelt_country_month.csv
    protest_roots: ["14"]               # CAMEO root code 14: protest
    violence_roots: ["18", "19", "20"]  # assault, fight, mass violence
    min_events: 50                      # fewer events in a year: shares are missing

# -----------------------------------------------------------------------------
# File paths
# -----------------------------------------------------------------------------
paths:
  warehouse: data/warehouse/ecowas.duckdb
  features_csv: data/processed/ecowas_country_year.csv
  forecast_csv: data/processed/ecowas_forecast_inputs.csv
  monthly_csv: data/processed/ecowas_country_month.csv
  results: results
  runs: runs                  # dated copies of the watch list (Airflow publish task)
  figures: figures

# -----------------------------------------------------------------------------
# Watch list (results/risk_next12.csv)
# Update the suspended members and the context notes when you raise the
# forecast year.
# -----------------------------------------------------------------------------
watch_list:
  # Tiers for current members, by the model's score from 0 to 1
  tiers:
    high: 0.85        # score of 0.85 or more
    elevated: 0.70    # score of 0.70 or more; anything lower is "Lower"
  # Members suspended at the time of the forecast, and the label to show
  suspended:
    GNB: Suspended (Nov 2025)
  # Short notes shown next to a member's score
  context:
    GNB: "Military council since Nov 2025; suspended; elections promised by Dec 6, 2026"
    GIN: "Readmitted Jan 2026 after Doumbouya's election; model does not yet see this"
    BEN: "Failed coup attempt Dec 7, 2025; borders Niger and Burkina Faso"

# -----------------------------------------------------------------------------
# Model settings
# -----------------------------------------------------------------------------
models:
  baseline:
    C: 1.0                    # inverse strength of the L2 (ridge) penalty
    class_weight: balanced    # rare action years count as much as quiet years
    max_iter: 1000
  # Version 2 (design fixed in docs/project-context.md, section 7)
  features_v2:
    # Own-country inputs, all from before the forecast year. Every version 2
    # model uses them; they are the graph neural network's node features.
    own:
      - military_rule_index_lag1
      - coups_successful_lag1
      - coups_successful_prev3
      - coups_failed_lag1
      - mass_mobilization_lag1
      - gdp_growth_lag1
      - inflation_lag1
      - ecowas_action_lag1
      - years_since_coup
      - gdelt_protest_share_lag1
      - gdelt_violence_share_lag1
    # Hand-built neighbor summaries, used by Baseline C v2 only
    border:
      - border_military_max_lag1
      - border_coups_prev3
  baseline_v2:
    C_grid: [0.01, 0.1, 1.0, 10.0]   # tuned with the inner folds
    class_weight: balanced
    max_iter: 5000
  gnn_v2:
    dropout: 0.2
    lr: 0.01
    weight_decay: 0.005
    epochs: 300
    gat_heads: 2              # GAT: 2 attention heads, averaged
    seeds: 25                 # final fit in each fold, predictions averaged
    inner_seeds: 3            # seeds for each fit during tuning
    inner_folds: 4            # training years split into 4 groups for tuning
    grid:                     # 8 settings, tried in this order (ties go to the first)
      layer: [sage, gat]
      graph: [borders, borders+waemu]
      hidden: [16, 32]
  bootstrap:
    reps: 2000                # year-clustered bootstrap resamples
    seed: 735
